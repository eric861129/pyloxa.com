    <style>
      .lost {
        min-height: 70vh;
        display: grid;
        align-content: center;
        gap: 20px;
        max-width: 640px;
      }
      .lost h1 {
        font-size: var(--step-display);

      }
      .lost .actions {
        display: flex;

    <!-- Google Analytics：不開廣告功能。裝置時區在歐洲（涵蓋歐洲經濟區、英國與瑞士及其海外地區）、是 UTC 或讀不到時，完全不載入；
         載入後若 Google 判斷訪客在這些地區，仍預設不使用 analytics cookie（第二道保護） -->
    <script>
      (() => {
      let tz = "";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch {}
      const europe =
        /^(Europe|Atlantic|Arctic|Etc)\//.test(tz) ||
        /^(UTC|UCT|GMT|Greenwich|Universal|Zulu|WET|CET|MET|EET|GB|GB-Eire|Eire|Iceland|Poland|Portugal)$/.test(tz) ||
        ["Asia/Nicosia", "Asia/Famagusta", "Africa/Ceuta", "America/Cayenne", "America/Guadeloupe", "America/Marigot", "America/Martinique", "America/St_Barthelemy", "Indian/Mayotte", "Indian/Reunion"].includes(tz);
      if (!tz || europe) return;
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=G-PWKKJHQV92";
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("consent", "default", { ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied", analytics_storage: "denied", region: ["AT", "BE", "BG", "HR", "CY", "CZ", "DK", "EE", "FI", "FR", "DE", "GR", "HU", "IS", "IE", "IT", "LV", "LI", "LT", "LU", "MT", "NL", "NO", "PL", "PT", "RO", "SK", "SI", "ES", "SE", "GB", "CH"] });
      gtag("consent", "default", { ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied", analytics_storage: "granted" });
      gtag("js", new Date());
      gtag("config", "G-PWKKJHQV92", { allow_google_signals: false, allow_ad_personalization_signals: false });
      // 下載按鈕：記成 download_click，在 GA 設為主要事件
      document.addEventListener("click", (e) => {
        const a = e.target.closest && e.target.closest('a[href*="Pyloxa-Releases/releases"]');
        if (a) gtag("event", "download_click", { link_url: a.href, link_text: a.textContent.trim().slice(0, 60) });
      });
      })();
    </script>
  </head>
  <body>
    <header class="wrap nav">
      <a class="mark" href="/" aria-label="Pyloxa home">Pyloxa</a>

    <main class="wrap lost">
      <h1>404</h1>

        <a class="button" href="/">Pyloxa home</a>
        <a class="button is-light" href="/zh-TW/" lang="zh-Hant-TW">繁體中文首頁</a>
      </div>
    </main>
